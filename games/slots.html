<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slots - Thomasino Casino</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="navbar-brand">
      <span class="logo-icon">🎰</span>
      THOMASINO
    </a>
    <div class="navbar-right">
      <div class="balance-display">
        <span class="coin-icon">💰</span>
        <span id="balance-amount" class="balance-amount">0.00</span>
        <span style="color: var(--text-muted);">€</span>
      </div>
      <button class="btn btn-primary btn-sm" onclick="openDepositModal()">Einzahlen</button>
    </div>
  </nav>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-section-title">Menü</div>
      <ul class="sidebar-nav">
        <li><a href="../index.html"><span class="nav-icon">🏠</span>Lobby</a></li>
        <li><a href="slots.html" class="active"><span class="nav-icon">🎰</span>Slots</a></li>
        <li><a href="blackjack.html"><span class="nav-icon">🃏</span>Blackjack</a></li>
        <li><a href="roulette.html"><span class="nav-icon">🎡</span>Roulette</a></li>
        <li><a href="dice.html"><span class="nav-icon">🎲</span>Dice</a></li>
        <li><a href="mines.html"><span class="nav-icon">💎</span>Mines</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="game-container">
        <div class="game-header">
          <a href="../index.html" class="back-btn">← Zurück</a>
          <h1>🎰 Slots</h1>
        </div>

        <div class="game-area">
          <div class="slot-machine">
            <div class="slot-reel" id="reel1">🍒</div>
            <div class="slot-reel" id="reel2">🍋</div>
            <div class="slot-reel" id="reel3">🍊</div>
          </div>
          <div id="slots-result"></div>
        </div>

        <div class="game-controls">
          <div class="control-group">
            <label>Einsatz (€)</label>
            <input type="number" id="slots-bet" min="1" value="100" step="10">
            <div class="bet-shortcuts">
              <button class="btn btn-secondary btn-sm" onclick="document.getElementById('slots-bet').value = 10">10</button>
              <button class="btn btn-secondary btn-sm" onclick="document.getElementById('slots-bet').value = 50">50</button>
              <button class="btn btn-secondary btn-sm" onclick="document.getElementById('slots-bet').value = 100">100</button>
              <button class="btn btn-secondary btn-sm" onclick="document.getElementById('slots-bet').value = 500">500</button>
              <button class="btn btn-secondary btn-sm" onclick="document.getElementById('slots-bet').value = 1000">1K</button>
            </div>
          </div>
          <button class="btn btn-primary" style="width:100%; font-size:1.1rem; padding:14px;" id="spin-btn" onclick="spinSlots()">
            🎰 DREHEN
          </button>
        </div>
      </div>

      <div class="footer">
        <p>Thomasino Casino &copy; 2026 — Nur Spielgeld, kein echtes Geld.</p>
      </div>
    </main>
  </div>

  <!-- Deposit Modal -->
  <div class="modal-overlay" id="deposit-modal">
    <div class="modal">
      <button class="modal-close" onclick="closeDepositModal()">&times;</button>
      <h2>💰 Spielgeld einzahlen</h2>
      <p style="color: var(--text-secondary); margin-bottom: 16px;">Wähle einen Betrag zum Einzahlen:</p>
      <div class="deposit-amounts">
        <button onclick="depositAmount(1000)">+1.000 €</button>
        <button onclick="depositAmount(5000)">+5.000 €</button>
        <button onclick="depositAmount(10000)">+10.000 €</button>
        <button onclick="depositAmount(50000)">+50.000 €</button>
      </div>
      <button class="btn btn-secondary" style="width:100%; margin-top:12px;" onclick="Balance.reset(); closeDepositModal();">Zurücksetzen (10.000 €)</button>
    </div>
  </div>

  <script src="../js/balance.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    const SYMBOLS = ['🍒', '🍋', '🍊', '🍇', '🔔', '⭐', '💎', '7️⃣'];
    const PAYOUTS = {
      '7️⃣': 50,
      '💎': 25,
      '⭐': 15,
      '🔔': 10,
      '🍇': 5,
      '🍊': 3,
      '🍋': 2,
      '🍒': 1.5
    };
    let spinning = false;

    function spinSlots() {
      if (spinning) return;

      const bet = parseFloat(document.getElementById('slots-bet').value);
      if (isNaN(bet) || bet <= 0) return;
      if (!Balance.canAfford(bet)) {
        document.getElementById('slots-result').innerHTML =
          '<div class="result-message result-lose">Nicht genug Spielgeld! 💸</div>';
        return;
      }

      Balance.subtract(bet);
      spinning = true;
      document.getElementById('spin-btn').disabled = true;
      document.getElementById('slots-result').innerHTML = '';

      const reels = [
        document.getElementById('reel1'),
        document.getElementById('reel2'),
        document.getElementById('reel3')
      ];

      reels.forEach(r => r.classList.add('spinning'));

      // Pick results
      const results = [
        SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)],
        SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)],
        SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]
      ];

      // Stop reels one by one
      reels.forEach((reel, i) => {
        setTimeout(() => {
          reel.classList.remove('spinning');
          reel.textContent = results[i];

          if (i === 2) {
            // All reels stopped, check win
            checkSlotResult(results, bet);
            spinning = false;
            document.getElementById('spin-btn').disabled = false;
          }
        }, 500 + i * 400);
      });
    }

    function checkSlotResult(results, bet) {
      const resultDiv = document.getElementById('slots-result');

      if (results[0] === results[1] && results[1] === results[2]) {
        // Jackpot - all three match
        const multiplier = PAYOUTS[results[0]] || 2;
        const winnings = bet * multiplier;
        Balance.add(winnings);
        resultDiv.innerHTML = `<div class="result-message result-win">🎉 JACKPOT! ${results[0]}${results[0]}${results[0]} — +${Balance.format(winnings)} € (x${multiplier})</div>`;
      } else if (results[0] === results[1] || results[1] === results[2] || results[0] === results[2]) {
        // Two match
        const winnings = bet * 1.5;
        Balance.add(winnings);
        resultDiv.innerHTML = `<div class="result-message result-win">✨ 2 gleiche! +${Balance.format(winnings)} € (x1.5)</div>`;
      } else {
        resultDiv.innerHTML = `<div class="result-message result-lose">Leider verloren! -${Balance.format(bet)} €</div>`;
      }
    }
  </script>
</body>
</html>
