<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dice - Thomasino Casino</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="navbar-brand">
      <span class="logo-icon">🎰</span>
      THOMASINO
    </a>
    <div class="navbar-right">
      <div class="balance-display">
        <span class="coin-icon">💰</span>
        <span id="balance-amount" class="balance-amount">0.00</span>
        <span style="color: var(--text-muted);">€</span>
      </div>
      <button class="btn btn-primary btn-sm" onclick="openDepositModal()">Einzahlen</button>
    </div>
  </nav>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-section-title">Menü</div>
      <ul class="sidebar-nav">
        <li><a href="../index.html"><span class="nav-icon">🏠</span>Lobby</a></li>
        <li><a href="slots.html"><span class="nav-icon">🎰</span>Slots</a></li>
        <li><a href="blackjack.html"><span class="nav-icon">🃏</span>Blackjack</a></li>
        <li><a href="roulette.html"><span class="nav-icon">🎡</span>Roulette</a></li>
        <li><a href="dice.html" class="active"><span class="nav-icon">🎲</span>Dice</a></li>
        <li><a href="mines.html"><span class="nav-icon">💎</span>Mines</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="game-container">
        <div class="game-header">
          <a href="../index.html" class="back-btn">← Zurück</a>
          <h1>🎲 Dice</h1>
        </div>

        <div class="game-area">
          <div class="dice-result-number" id="dice-result-number">—</div>

          <div class="dice-slider-container">
            <input type="range" class="dice-slider" id="dice-slider" min="1" max="99" value="50"
              oninput="updateDiceSlider()">
            <div class="dice-info">
              <div class="dice-info-item">
                <label>Roll Under</label>
                <span id="dice-target" style="color: var(--green);">50.00</span>
              </div>
              <div class="dice-info-item">
                <label>Gewinnchance</label>
                <span id="dice-chance">50.00%</span>
              </div>
              <div class="dice-info-item">
                <label>Multiplikator</label>
                <span id="dice-multiplier" style="color: var(--orange-primary);">1.98x</span>
              </div>
            </div>
          </div>

          <div id="dice-result"></div>
        </div>

        <div class="game-controls">
          <div class="control-group">
            <label>Einsatz (€)</label>
            <input type="number" id="dice-bet" min="1" value="100" step="10">
            <div class="bet-shortcuts">
              <button class="btn btn-secondary btn-sm" onclick="document.getElementById('dice-bet').value = 10">10</button>
              <button class="btn btn-secondary btn-sm" onclick="document.getElementById('dice-bet').value = 50">50</button>
              <button class="btn btn-secondary btn-sm" onclick="document.getElementById('dice-bet').value = 100">100</button>
              <button class="btn btn-secondary btn-sm" onclick="document.getElementById('dice-bet').value = 500">500</button>
              <button class="btn btn-secondary btn-sm" onclick="document.getElementById('dice-bet').value = 1000">1K</button>
            </div>
          </div>
          <button class="btn btn-primary" style="width:100%; font-size:1.1rem; padding:14px;" id="dice-roll-btn" onclick="rollDice()">
            🎲 WÜRFELN
          </button>
        </div>
      </div>

      <div class="footer">
        <p>Thomasino Casino &copy; 2026 — Nur Spielgeld, kein echtes Geld.</p>
      </div>
    </main>
  </div>

  <!-- Deposit Modal -->
  <div class="modal-overlay" id="deposit-modal">
    <div class="modal">
      <button class="modal-close" onclick="closeDepositModal()">&times;</button>
      <h2>💰 Spielgeld einzahlen</h2>
      <p style="color: var(--text-secondary); margin-bottom: 16px;">Wähle einen Betrag zum Einzahlen:</p>
      <div class="deposit-amounts">
        <button onclick="depositAmount(1000)">+1.000 €</button>
        <button onclick="depositAmount(5000)">+5.000 €</button>
        <button onclick="depositAmount(10000)">+10.000 €</button>
        <button onclick="depositAmount(50000)">+50.000 €</button>
      </div>
      <button class="btn btn-secondary" style="width:100%; margin-top:12px;" onclick="Balance.reset(); closeDepositModal();">Zurücksetzen (10.000 €)</button>
    </div>
  </div>

  <script src="../js/balance.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    const HOUSE_EDGE = 0.01; // 1% house edge

    function updateDiceSlider() {
      const slider = document.getElementById('dice-slider');
      const target = parseInt(slider.value);
      const chance = target;
      const multiplier = (99 / chance) * (1 - HOUSE_EDGE);

      document.getElementById('dice-target').textContent = target.toFixed(2);
      document.getElementById('dice-chance').textContent = chance.toFixed(2) + '%';
      document.getElementById('dice-multiplier').textContent = multiplier.toFixed(2) + 'x';

      // Update slider gradient
      slider.style.setProperty('--slider-pct', target + '%');
    }

    function rollDice() {
      const bet = parseFloat(document.getElementById('dice-bet').value);
      if (isNaN(bet) || bet <= 0) return;
      if (!Balance.canAfford(bet)) {
        document.getElementById('dice-result').innerHTML =
          '<div class="result-message result-lose">Nicht genug Spielgeld! 💸</div>';
        return;
      }

      Balance.subtract(bet);

      const slider = document.getElementById('dice-slider');
      const target = parseInt(slider.value);
      const chance = target;
      const multiplier = (99 / chance) * (1 - HOUSE_EDGE);

      // Generate result (0.00 to 99.99)
      const result = Math.random() * 100;
      const resultDisplay = document.getElementById('dice-result-number');
      const resultDiv = document.getElementById('dice-result');

      // Animate the result number
      resultDisplay.textContent = result.toFixed(2);

      const won = result < target;

      if (won) {
        const winnings = bet * multiplier;
        Balance.add(winnings);
        const profit = winnings - bet;
        resultDisplay.style.color = 'var(--green)';
        resultDiv.innerHTML = `<div class="result-message result-win">🎉 ${result.toFixed(2)} < ${target} — Gewonnen! +${Balance.format(profit)} € (x${multiplier.toFixed(2)})</div>`;
      } else {
        resultDisplay.style.color = 'var(--red)';
        resultDiv.innerHTML = `<div class="result-message result-lose">😞 ${result.toFixed(2)} ≥ ${target} — Verloren! -${Balance.format(bet)} €</div>`;
      }
    }

    // Initialize slider
    updateDiceSlider();
  </script>
</body>
</html>
